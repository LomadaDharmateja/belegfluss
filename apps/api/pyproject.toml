[project]
name = "belegfluss"
version = "0.1.0"
description = "Belegfluss API (and, from M2, the worker)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20",
    "azure-storage-blob>=12.31",
    "azure-storage-queue>=12.18",
    "fastapi>=0.165",
    "httpx2>=2.16",
    "lxml>=6.1",
    "psycopg[binary]>=3.3",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "pyjwt[crypto]>=2.15",
    "pypdf>=7.1",
    "pypdfium2>=5.15",
    "python-multipart>=0.0.34",
    "saxonche>=13.1.1",
    "sqlalchemy>=2.1",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "factur-x>=7.10",
    "httpx2>=2.16",
    "lxml-stubs>=0.5",
    "mypy>=2.4",
    "pytest>=9.2",
    "ruff>=0.17",
    "testcontainers[azurite,postgres]>=4.15",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["N999"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection uses calls in argument defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Header", "fastapi.Query"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# No type information shipped by these packages.
module = ["testcontainers.*", "saxonche", "pypdfium2", "facturx"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
