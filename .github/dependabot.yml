version: 2
updates:
  - package-ecosystem: uv
    directory: /apps/api
    schedule: { interval: weekly }
    groups:
      python-dependencies: { patterns: ["*"] }

  - package-ecosystem: npm # pnpm workspace (lockfile at the root)
    directory: /
    schedule: { interval: weekly }
    groups:
      web-dependencies: { patterns: ["*"] }

  - package-ecosystem: github-actions # actions are pinned by commit SHA
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: docker
    directories: ["/apps/api", "/apps/web", "/services/validator"]
    schedule: { interval: weekly }
