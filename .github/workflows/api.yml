name: api

on:
  pull_request:
    paths: ["apps/api/**", "apps/web/src/api/openapi.json", "services/validator/**", "scripts/**", ".github/workflows/api.yml"]
  workflow_call: # on main: run by deploy.yml before anything is deployed

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install (Python version from .python-version)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types (mypy strict)
        run: uv run mypy src
      # Official XRechnung test suite, pinned by SHA-256 (ADR-0008). CI=true makes a missing suite fail.
      - name: Cache test data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: testdata/external
          key: testdata-${{ hashFiles('scripts/fetch_test_data.py') }}
      - name: Fetch test data
        working-directory: .
        run: python3 scripts/fetch_test_data.py
      - name: Tests (real PostgreSQL, Azurite and KoSIT validator via testcontainers)
        run: uv run pytest
