name: infra

# Static checks for the Terraform code (ADR-0020). No Azure access, no state, no secrets:
# format, validate, lint, and a security scan of the configuration.
on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -recursive -check infra
      - name: Validate (providers from the lock files)
        run: |
          for stack in bootstrap shared environment; do
            terraform -chdir=infra/$stack init -backend=false -input=false -lockfile=readonly
            terraform -chdir=infra/$stack validate
          done
      - name: Install tflint and trivy (pinned versions, verified checksums)
        run: |
          curl -sSL -o tflint.zip https://github.com/terraform-linters/tflint/releases/download/v0.66.0/tflint_linux_amd64.zip
          echo "22be11cadc25cd02401e94c0ccc91aa63467debb8485c2a755d98f4c0a9d1e2e  tflint.zip" | sha256sum --check -
          unzip -q tflint.zip tflint
          curl -sSL -o trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz
          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  trivy.tar.gz" | sha256sum --check -
          tar -xzf trivy.tar.gz trivy
      - name: Lint
        env:
          GITHUB_TOKEN: ${{ github.token }} # tflint downloads its azurerm ruleset from GitHub
        run: |
          ./tflint --config "$PWD/infra/.tflint.hcl" --init
          for stack in bootstrap shared environment; do
            ./tflint --config "$PWD/infra/.tflint.hcl" --chdir "infra/$stack"
          done
      - name: Security scan of the configuration
        run: ./trivy config --exit-code 1 --severity HIGH,CRITICAL --ignorefile infra/.trivyignore infra
