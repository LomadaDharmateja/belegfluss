# Local stack: docker compose up --build   →  web http://localhost:3000, API http://localhost:8000
# Optional settings come from .env (copy .env.example). Everything binds to 127.0.0.1 only.
name: belegfluss

# Settings shared by the API and the worker (same image).
x-backend-env: &backend-env
  BELEGFLUSS_DATABASE_URL: postgresql+psycopg://belegfluss:${POSTGRES_PASSWORD:-belegfluss-dev}@postgres:5432/belegfluss
  BELEGFLUSS_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=belegflussdev;AccountKey=ZGV2LWtleS1ub3Qtc2VjcmV0;BlobEndpoint=http://azurite:10000/belegflussdev;QueueEndpoint=http://azurite:10001/belegflussdev;" # gitleaks:allow (local emulator only)

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: belegfluss
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-belegfluss-dev}
      POSTGRES_DB: belegfluss
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U belegfluss -d belegfluss"]
      interval: 2s
      timeout: 3s
      retries: 30

  azurite:
    # Local emulator for Azure Blob/Queue storage. The dev account key below is NOT a secret:
    # it only works against this local emulator (base64 of "dev-key-not-secret").
    image: mcr.microsoft.com/azure-storage/azurite:3.38.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --location /data --skipApiVersionCheck
    environment:
      AZURITE_ACCOUNTS: "belegflussdev:ZGV2LWtleS1ub3Qtc2VjcmV0" # gitleaks:allow (local emulator only)
    ports: ["127.0.0.1:10000:10000", "127.0.0.1:10001:10001"]
    volumes: ["azurite:/data"]

  validator:
    # Official KoSIT validator (ADR-0005). No `ports`: the daemon has no authentication, so it is
    # reachable only inside this network, by the worker.
    build: { context: services/validator }

  api:
    build: { context: apps/api }
    environment:
      <<: *backend-env
      BELEGFLUSS_AUTH_ISSUER: ${BELEGFLUSS_AUTH_ISSUER:-}
      BELEGFLUSS_AUTH_JWKS_URL: ${BELEGFLUSS_AUTH_JWKS_URL:-}
      BELEGFLUSS_AUTH_AUDIENCE: ${BELEGFLUSS_AUTH_AUDIENCE:-}
      BELEGFLUSS_CORS_ORIGINS: '["http://localhost:3000"]'
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      azurite: { condition: service_started }

  worker:
    # Same image as the API, other command (ADR-0004). Reads documents, validates and checks them.
    build: { context: apps/api }
    command: ["python", "-m", "belegfluss.worker"]
    environment:
      <<: *backend-env
      BELEGFLUSS_VALIDATOR_URL: http://validator:8080
    healthcheck: { disable: true } # the image's check targets the API's HTTP port
    depends_on:
      api: { condition: service_healthy } # the API applies the migrations
      validator: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_TENANT_SUBDOMAIN: ${ENTRA_TENANT_SUBDOMAIN:-}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_API_SCOPE: ${ENTRA_API_SCOPE:-}
      API_BASE_URL: http://localhost:8000 # called from the browser
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  azurite:
