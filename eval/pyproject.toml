[project]
name = "belegfluss-eval"
version = "0.1.0"
description = "Belegfluss extraction evaluation: labelled set, metrics, reports and the CI gate (ADR-0018)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["belegfluss"]

[tool.uv.sources]
belegfluss = { path = "../apps/api", editable = true }

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["saxonche", "pypdfium2", "faker", "faker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
